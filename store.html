<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Apple</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <h1>TIENDA</h1>
  <main class="catalogo">
    
    <!-- Imagen Inicio Principal -->
    <div class="producto">
      <img src="img/inicio principal.png" alt="Inicio principal">
      <h2>Inicio Principal</h2>
      <p>Pantalla de bienvenida</p>
    </div>

    <!-- Imagen Tienda -->
    <div class="producto">
      <img src="img/tienda.png" alt="Tienda">
      <h2>Pantalla Tienda</h2>
      <p>Vista general de la tienda</p>
    </div>

    <!-- Imagen Detalle del Producto -->
    <div class="producto">
      <img src="img/detalle del producto.png" alt="Detalle del producto">
      <h2>Detalle del Producto</h2>
      <p>Información completa del producto</p>
    </div>

  </main>

  <!-- Botones de navegación -->
  <div class="navegacion">
    <button onclick="window.location.href='index.html'">Ir a Bienvenido</button>
    <button onclick="window.location.href='catalogo.html'">Ir a Catálogo</button>
  </div>
</body>
</html>
